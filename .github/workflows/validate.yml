name: Validate static app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript syntax
        run: node scripts/validate-inline-js.mjs
      - name: Test odd-team randomization and tie-breaking
        run: node scripts/test-team-randomization.mjs
      - name: Test victory registration and points
        run: node scripts/test-victory-registration.mjs
      - name: Test Cloudflare shared-state Worker
        run: node scripts/test-cloudflare-worker.mjs
