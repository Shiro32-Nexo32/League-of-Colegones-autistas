<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEAGUE OF FRIENDS - PURE EDITION</title>
    <style>
        :root { 
            --gold: #c8aa6e; --gold-dark: #785a28; --blue-dark: #010a13; 
            --blue-medium: #091428; --blue-bright: #007eff; --red: #e22222;
        }
        body { background: var(--blue-dark); color: var(--gold); font-family: 'Times New Roman', serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; border: 1px solid var(--gold-dark); background: var(--blue-medium); padding: 40px; box-shadow: 0 0 50px black; }
        h1, h2 { text-transform: uppercase; letter-spacing: 4px; border-bottom: 2px solid var(--gold-dark); padding-bottom: 10px; text-align: center; color: white; }
        .ranking-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .ranking-table th { background: var(--gold-dark); color: black; padding: 12px; text-transform: uppercase; }
        .ranking-table td { padding: 12px; text-align: center; border-bottom: 1px solid rgba(200,170,110,0.2); color: #f0e6d2; }
        .selector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 30px 0; }
        .player-card { border: 1px solid var(--gold-dark); padding: 15px; text-align: center; cursor: pointer; background: rgba(0,0,0,0.3); text-transform: uppercase; }
        .player-card.selected { background: var(--gold); color: black; box-shadow: 0 0 15px var(--gold); }
        .player-card.locked { opacity: 0.55; cursor: not-allowed; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        .teams-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .team-box { border: 1px solid var(--gold-dark); min-height: 300px; padding: 20px; background: rgba(0,0,0,0.4); }
        .blue-side { border-top: 5px solid var(--blue-bright); }
        .red-side { border-top: 5px solid var(--red); }
        .slot { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; padding: 10px; background: rgba(255,255,255,0.03); opacity: 0; transition: opacity 0.5s; border: 1px solid transparent; }
        .slot.visible { opacity: 1; }
        .slot img { width: 60px; height: 60px; border: 1px solid var(--gold-dark); }
        .slot.active { border: 1px solid var(--gold); background: rgba(200,170,110,0.1); }
        .mvp-button { margin-left: auto; padding: 8px 12px; font-size: 0.75em; }
        .mvp-button.selected { background: var(--gold); color: black; }
        .mvp-button:disabled { opacity: 0.4; cursor: not-allowed; }
        #editor-panel { display: none; background: #050d17; border: 2px solid var(--gold); padding: 20px; margin-top: 20px; }
        .editor-input { background: black; color: white; border: 1px solid var(--gold-dark); padding: 5px; width: 60px; }
        button { background: var(--gold-dark); color: white; border: 1px solid var(--gold); padding: 15px 30px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        button:hover { background: var(--gold); color: black; }
        #history-modal {
            display: none; position: fixed; z-index: 1000; inset: 0;
            background: rgba(0,0,0,0.85); padding: 20px; box-sizing: border-box;
        }
        #history-content {
            max-width: 900px; max-height: 85vh; overflow-y: auto; margin: 5vh auto;
            background: var(--blue-medium); border: 2px solid var(--gold);
            padding: 25px; box-shadow: 0 0 40px black;
        }
        .history-match {
            border: 1px solid var(--gold-dark); padding: 18px; margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
        }
        .history-match h3 { margin-top: 0; color: white; }
        .history-team { margin: 12px 0; color: #f0e6d2; }
        .history-players { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
        .history-player { display: flex; align-items: center; gap: 12px; padding: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(200,170,110,0.2); }
        .history-player img { width: 50px; height: 50px; border: 1px solid var(--gold-dark); }
        .history-player small { display: block; opacity: 0.75; margin-top: 3px; }
        .history-winner { color: var(--gold); font-weight: bold; }
        @media (max-width: 700px) {
            body { padding: 8px; }
            .container { padding: 20px; }
            .teams-wrapper { grid-template-columns: 1fr; }
            #history-content { margin: 2vh auto; max-height: 92vh; padding: 15px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div id="test-info" style="font-size: 0.8em; opacity: 0.5; text-align: center;">CONECTANDO CON SERVIDORES DE RIOT...</div>
    <h1>RANKING</h1>
    <table class="ranking-table">
        <thead><tr><th>Rango</th><th>Invocador</th><th>Puntos</th><th>Victorias</th><th>MVP</th><th>Win Rate</th></tr></thead>
        <tbody id="lista-ranking"></tbody>
    </table>
    <div style="text-align: left; margin-top: 10px; margin-bottom: 20px;">
        <button onclick="abrirHistorial()">ÚLTIMAS 20 PARTIDAS</button>
    </div>
    <div style="text-align: right; margin-top: 15px;"><button onclick="desbloquearPartida()">DESBLOQUEAR PARTIDA</button></div>
    <div id="pin-panel" style="display: none; margin-top: 15px; padding: 20px; border: 1px solid var(--gold-dark); text-align: center; background: rgba(0,0,0,0.3);">
        <input id="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" style="background: black; color: white; border: 1px solid var(--gold-dark); padding: 12px; width: 120px; text-align: center; font-size: 1.2em;">
        <button onclick="comprobarPIN()" style="margin-left: 10px;">ENTRAR</button>
    </div>
    <div id="editor-pin-panel" style="display: none; margin-top: 15px; padding: 20px; border: 1px solid var(--gold-dark); text-align: center; background: rgba(0,0,0,0.3);">
        <input id="editor-pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" style="background: black; color: white; border: 1px solid var(--gold-dark); padding: 12px; width: 120px; text-align: center; font-size: 1.2em;">
        <button onclick="comprobarPINEditor()" style="margin-left: 10px;">ENTRAR</button>
    </div>
    <div id="zona-protegida" style="display: none;">
    <div style="text-align: right;"><button onclick="abrirEditor()">Modo Editor</button></div>
    <div id="editor-panel">
        <h2>EDITOR DE INVOCADORES</h2>
        <table class="ranking-table">
            <thead><tr><th>Nombre</th><th>Partidas jugadas</th><th>W</th><th>M</th><th>Nivel</th><th>Acción</th></tr></thead>
            <tbody id="tabla-editor"></tbody>
        </table>
        <button onclick="nuevoJugador()">+ Nuevo Jugador</button>
        <button onclick="exportarDatos()">Exportar copia</button>
        <button onclick="document.getElementById('backup-input').click()">Importar copia</button>
        <input id="backup-input" type="file" accept="application/json,.json" style="display:none" onchange="importarDatos(event)">
        <button onclick="reiniciarHistorial()" style="background: #7b1111;">Reiniciar Historial</button>
        <button onclick="cerrarEditor()" style="background: #444;">Guardar Cambios</button>
    </div>
    <hr style="border:1px solid var(--gold-dark); margin: 40px 0;">
    <h2>DRAFT DE PARTIDA</h2>
    <div id="grid-jugadores" class="selector-grid"></div>
    <button id="generar-equipos-button" style="width: 100%; font-size: 1.5em;" onclick="lanzarSorteoSequencial()">GENERAR EQUIPOS Y CAMPEONES</button>
    <div id="winner-panel" style="display: none; margin-top: 25px; padding: 20px; border: 2px solid var(--gold); text-align: center; background: rgba(200,170,110,0.08);">
        <h2 style="margin-top: 0;">EQUIPO GANADOR</h2>
        <div style="margin-bottom: 15px; color: #f0e6d2;">Selecciona un MVP de cada equipo y después el equipo ganador.</div>
        <button onclick="registrarVictoria('blue')" style="margin: 5px;">EQUIPO AZUL</button>
        <button onclick="registrarVictoria('red')" style="margin: 5px; background: var(--red);">EQUIPO ROJO</button>
    </div>
    <div class="teams-wrapper" style="margin-top: 30px;">
        <div class="team-box blue-side">
            <h3 style="color: var(--blue-bright)">EQUIPO AZUL</h3>
            <div id="slots-blue"></div>
        </div>
        <div class="team-box red-side">
            <h3 style="color: var(--red)">EQUIPO ROJO</h3>
            <div id="slots-red"></div>
        </div>
    </div>
    </div>
</div>

<div id="history-modal" onclick="cerrarHistorial(event)">
    <div id="history-content">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:15px;">
            <h2 style="margin:0;">HISTORIAL DE PARTIDAS</h2>
            <button onclick="cerrarHistorial()">CERRAR</button>
        </div>
        <div id="history-list" style="margin-top:20px;"></div>
    </div>
</div>

<script>
    const PIN_SECRET = String.fromCharCode(51, 54, 53, 52);
    let CHAMPIONS = [];
    let VERSION = "14.3.1";

    function playTick() {
        let a = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
        a.volume = 0.15; a.play();
    }

    function playBoom() {
        let a = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
        a.volume = 0.4; a.play();
    }

    function leerJSONLocalStorage(clave, valorPredeterminado) {
        try {
            const contenido = localStorage.getItem(clave);
            if (contenido === null) return valorPredeterminado;
            const datos = JSON.parse(contenido);
            return datos === null ? valorPredeterminado : datos;
        } catch (error) {
            console.warn('No se pudo leer el almacenamiento local de ' + clave + '.', error);
            return valorPredeterminado;
        }
    }

    function escaparHTML(valor) {
        const entidades = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return String(valor ?? '').replace(/[&<>"']/g, caracter => entidades[caracter]);
    }

    function urlImagenCampeonSegura(valor) {
        try {
            const url = new URL(String(valor));
            if (
                url.protocol === 'https:' &&
                url.hostname === 'ddragon.leagueoflegends.com' &&
                /^\/cdn\/[\w.-]+\/img\/champion\/[\w.-]+\.png$/.test(url.pathname)
            ) return url.href;
        } catch (error) {
            // Las imágenes inválidas no se muestran en el historial.
        }
        return null;
    }

    function enteroNoNegativo(valor) {
        const numero = Number.parseInt(valor, 10);
        return Number.isFinite(numero) ? Math.max(0, numero) : 0;
    }

    function nivelSeguro(valor) {
        const numero = Number(valor);
        return Number.isFinite(numero) ? Math.max(0, Math.min(5, numero)) : 3;
    }

    let db = leerJSONLocalStorage('lol_pure_db_v3', {
        "Shiro": { w: 0, m: 0, games: 0 },
        "Maku": { w: 0, m: 0, games: 0 },
        "gordi": { w: 0, m: 0, games: 0 },
        "Lobo": { w: 0, m: 0, games: 0 },
        "Ivet": { w: 0, m: 0, games: 0 },
        "Lidia": { w: 0, m: 0, games: 0 },
        "Porreta": { w: 0, m: 0, games: 0 },
        "Iraida": { w: 0, m: 0, games: 0 },
        "AlexVivaEta": { w: 0, m: 0, games: 0 }
    });

    const PERFILES_CREADOS_POR_SISTEMA = [
        "Macu",
        "Borreta",
        "Alex Goreta",
        "Adame el Omega",
        "Kai",
        "Iraideta"
    ];

    const VERSION_LIMPIEZA_PERFILES = 'limpieza_perfiles_sistema_v1';
    if (!localStorage.getItem(VERSION_LIMPIEZA_PERFILES)) {
        PERFILES_CREADOS_POR_SISTEMA.forEach(name => {
            if (db[name]) delete db[name];
        });
        localStorage.setItem(VERSION_LIMPIEZA_PERFILES, '1');
    }

    const NIVELES_INICIALES = {
        "Shiro": 5,
        "Maku": 5,
        "Macu": 5,
        "Ivet": 4.5,
        "Lobo": 4,
        "Iraida": 1.5,
        "Iraideta": 1.5,
        "adamelomega57": 3,
        "Adame el Omega": 3,
        "Lidia": 3,
        "AlexVivaEta": 2,
        "Alex Goreta": 2,
        "Porreta": 2,
        "Borreta": 2,
        "gordi": 1,
        "kayETA": 1,
        "Kai": 1
    };

    if (!db || typeof db !== 'object' || Array.isArray(db)) db = {};
    Object.keys(db).forEach(name => {
        if (!db[name] || typeof db[name] !== 'object' || Array.isArray(db[name])) db[name] = {};
        db[name].games = enteroNoNegativo(db[name].games);
        db[name].m = enteroNoNegativo(db[name].m);
        db[name].w = enteroNoNegativo(db[name].w);
        db[name].level = db[name].level === undefined
            ? (NIVELES_INICIALES[name] ?? 3)
            : nivelSeguro(db[name].level);
    });

    const AJUSTE_PARTIDAS_INICIALES = 'ajuste_partidas_alexgoraeta_iraideta_v1';

    if (!localStorage.getItem(AJUSTE_PARTIDAS_INICIALES)) {
        if (db["AlexGoraEta"]) db["AlexGoraEta"].games = 2;
        if (db["IraidETA"]) db["IraidETA"].games = 2;
        localStorage.setItem(AJUSTE_PARTIDAS_INICIALES, '1');
        localStorage.setItem('lol_pure_db_v3', JSON.stringify(db));
    }

    function nivelJugador(name) {
        const nivel = Number(db[name]?.level);
        return Number.isFinite(nivel) ? Math.max(0, Math.min(5, nivel)) : 3;
    }

    function barajar(array) {
        const resultado = [...array];
        for (let i = resultado.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [resultado[i], resultado[j]] = [resultado[j], resultado[i]];
        }
        return resultado;
    }

    function crearCombinaciones(array, cantidad) {
        const resultado = [];

        function recorrer(inicio, elegidos) {
            if (elegidos.length === cantidad) {
                resultado.push([...elegidos]);
                return;
            }

            for (let i = inicio; i < array.length; i++) {
                elegidos.push(array[i]);
                recorrer(i + 1, elegidos);
                elegidos.pop();
            }
        }

        recorrer(0, []);
        return resultado;
    }

    function prepararEquiposImpares(jugadores) {
        const cantidadPequeno = Math.floor(jugadores.length / 2);
        const combinaciones = crearCombinaciones(jugadores, cantidadPequeno);
        const fuerzaTotal = jugadores.reduce((total, name) => total + nivelJugador(name), 0);

        const objetivos = combinaciones.map(pequeno => {
            const fuerzaPequeno = pequeno.reduce((total, name) => total + nivelJugador(name), 0);
            const fuerzaGrande = fuerzaTotal - fuerzaPequeno;
            return {
                pequeno,
                diferencia: fuerzaPequeno - fuerzaGrande
            };
        });

        const validas = objetivos.filter(opcion => opcion.diferencia >= 0);
        const candidatas = validas.length > 0
            ? validas
            : objetivos.sort((a, b) => b.diferencia - a.diferencia).slice(0, 1);

        const mejorDiferencia = Math.min(...candidatas.map(opcion => opcion.diferencia));
        const mejores = candidatas.filter(opcion => Math.abs(opcion.diferencia - mejorDiferencia) < 0.0001);
        const elegida = mejores[Math.floor(Math.random() * mejores.length)].pequeno;
        const grande = jugadores.filter(name => !elegida.includes(name));

        if (Math.random() < 0.5) {
            return { blue: elegida, red: grande };
        }

        return { blue: grande, red: elegida };
    }

    let seleccionados = [];
    let accesoPartida = false;
    let equiposActuales = { blue: [], red: [] };
    let partidaPendiente = false;
    let sorteoEnCurso = false;
    let mvpElegido = { blue: false, red: false };
    let mvpActual = { blue: null, red: null };
    let campeonesActuales = { blue: {}, red: {} };
    let historialPartidas = leerJSONLocalStorage('lol_match_history', []);
    if (!Array.isArray(historialPartidas)) historialPartidas = [];
    historialPartidas = historialPartidas
        .filter(partida => partida && typeof partida === 'object' && Array.isArray(partida.blue) && Array.isArray(partida.red) && ['blue', 'red'].includes(partida.ganador))
        .slice(0, 20);

    async function init() {
        const estado = document.getElementById('test-info');
        try {
            const vRes = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
            if (!vRes.ok) throw new Error('No se pudo obtener la versión de Data Dragon.');
            const vData = await vRes.json();
            if (!Array.isArray(vData) || !vData[0]) throw new Error('La respuesta de versiones no es válida.');
            VERSION = vData[0];

            const cRes = await fetch(`https://ddragon.leagueoflegends.com/cdn/${VERSION}/data/es_ES/champion.json`);
            if (!cRes.ok) throw new Error('No se pudo descargar la lista de campeones.');
            const cData = await cRes.json();
            CHAMPIONS = Object.values(cData.data || {});
            if (CHAMPIONS.length === 0) throw new Error('La lista de campeones está vacía.');
            estado.innerText = `ASSETS CARGADOS | VER: ${VERSION} | CHAMPIONS: ${CHAMPIONS.length}`;
        } catch (error) {
            estado.innerText = 'SIN CONEXIÓN CON DATA DRAGON | Ranking e historial locales disponibles';
            console.error('No se pudieron cargar los campeones.', error);
        } finally {
            actualizarInterfaz();
        }
    }

    function actualizarInterfaz() {
        renderRanking();
        renderSelector();
        renderHistorial();
        localStorage.setItem('lol_pure_db_v3', JSON.stringify(db));
        localStorage.setItem('lol_match_history', JSON.stringify(historialPartidas));
    }

    function renderRanking() {
        const ranking = Object.keys(db).map(name => ({
            name, ...db[name], pts: (db[name].w * 10) + (db[name].m * 5),
            winRate: db[name].games > 0 ? (db[name].w / db[name].games) * 100 : 0
        })).sort((a,b) => b.pts - a.pts);
        document.getElementById('lista-ranking').innerHTML = ranking.map((j, i) => `
            <tr><td>${i+1}</td><td>${escaparHTML(j.name)}</td><td>${escaparHTML(j.pts)}</td><td>${escaparHTML(j.w)}</td><td>${escaparHTML(j.m)}</td><td>${escaparHTML(j.winRate.toFixed(1))}%</td></tr>
        `).join('');
    }

    function renderSelector() {
        const grid = document.getElementById('grid-jugadores');
        const bloqueado = sorteoEnCurso || partidaPendiente;
        grid.innerHTML = Object.keys(db).sort().map(name => `
            <div class="player-card ${seleccionados.includes(name) ? 'selected' : ''} ${bloqueado ? 'locked' : ''}"
                 data-player="${escaparHTML(name)}" role="button" tabindex="0"
                 aria-pressed="${seleccionados.includes(name)}" aria-disabled="${bloqueado}">
                ${escaparHTML(name)}
            </div>
        `).join('');
    }

    function desbloquearPartida() {
        if (accesoPartida) return;
        document.getElementById('pin-panel').style.display = 'block';
        document.getElementById('pin-input').value = '';
        document.getElementById('pin-input').focus();
    }

    function comprobarPIN() {
        const pin = document.getElementById('pin-input').value;
        if (pin !== PIN_SECRET) return alert("ACCESO DENEGADO");
        accesoPartida = true;
        document.getElementById('pin-panel').style.display = 'none';
        document.getElementById('zona-protegida').style.display = 'block';
    }

    function togglePlayer(name) {
        if (!accesoPartida) return alert("Introduce el PIN para acceder a la partida.");
        if (sorteoEnCurso || partidaPendiente) return alert("Termina de registrar la partida actual antes de cambiar jugadores.");
        if (!db[name]) return;
        if (seleccionados.includes(name)) seleccionados = seleccionados.filter(n => n !== name);
        else if (seleccionados.length < 10) seleccionados.push(name);
        else return alert("Puedes seleccionar como máximo 10 jugadores.");
        renderSelector();
    }

    async function lanzarSorteoSequencial() {
        if (!accesoPartida) return alert("Introduce el PIN para acceder a la partida.");
        if (sorteoEnCurso) return alert("El sorteo ya está en curso.");
        if (partidaPendiente) return alert("Registra primero el equipo ganador de la partida actual.");
        if (!CHAMPIONS.length) return alert("No se han podido cargar los campeones. Comprueba la conexión y recarga la página.");
        if (seleccionados.length < 2) return alert("Selecciona al menos 2 jugadores.");

        sorteoEnCurso = true;
        const botonSorteo = document.getElementById('generar-equipos-button');
        botonSorteo.disabled = true;
        renderSelector();

        try {
            const shuffle = barajar(seleccionados);
            let blueSide;
            let redSide;

            if (shuffle.length % 2 === 0) {
                const mitad = shuffle.length / 2;
                blueSide = shuffle.slice(0, mitad);
                redSide = shuffle.slice(mitad);
            } else {
                const equipos = prepararEquiposImpares(shuffle);
                blueSide = equipos.blue;
                redSide = equipos.red;
            }

            equiposActuales = { blue: [...blueSide], red: [...redSide] };
            mvpElegido = { blue: false, red: false };
            mvpActual = { blue: null, red: null };
            campeonesActuales = { blue: {}, red: {} };
            partidaPendiente = false;
            document.getElementById('winner-panel').style.display = 'none';
            document.getElementById('slots-blue').innerHTML = "";
            document.getElementById('slots-red').innerHTML = "";

            const rondas = Math.max(blueSide.length, redSide.length);
            for (let i = 0; i < rondas; i++) {
                const animaciones = [];
                if (blueSide[i]) animaciones.push(animarPareja('slots-blue', blueSide[i]));
                if (redSide[i]) animaciones.push(animarPareja('slots-red', redSide[i]));
                await Promise.all(animaciones);
                if (i < rondas - 1) await new Promise(r => setTimeout(r, 1500));
            }

            document.querySelectorAll('.mvp-button').forEach(button => { button.disabled = false; });
            partidaPendiente = true;
            document.getElementById('winner-panel').style.display = 'block';
            actualizarInterfaz();
        } catch (error) {
            console.error('Error al generar la partida.', error);
            partidaPendiente = false;
            document.getElementById('winner-panel').style.display = 'none';
            alert("No se pudo generar la partida. Recarga la página e inténtalo de nuevo.");
        } finally {
            sorteoEnCurso = false;
            botonSorteo.disabled = false;
            renderSelector();
        }
    }

    function registrarMVP(equipo, name, button) {
        if (!partidaPendiente || !['blue', 'red'].includes(equipo) || mvpElegido[equipo]) return;
        if (!equiposActuales[equipo].includes(name) || !db[name]) return;

        mvpElegido[equipo] = true;
        mvpActual[equipo] = name;
        button.classList.add('selected');
        button.innerText = 'MVP ✓';

        document.querySelectorAll('#slots-' + equipo + ' .mvp-button').forEach(btn => {
            if (btn !== button) btn.disabled = true;
        });

    }

    function registrarVictoria(equipo) {
        if (!partidaPendiente || !['blue', 'red'].includes(equipo)) return;

        const jugadoresDeLaPartida = [...equiposActuales.blue, ...equiposActuales.red];
        if (jugadoresDeLaPartida.some(name => !db[name])) {
            return alert("No se puede registrar la partida porque falta un jugador en el ranking. Revisa los datos antes de continuar.");
        }

        // Se cuentan los participantes del sorteo, no la selección que quede en pantalla.
        jugadoresDeLaPartida.forEach(name => {
            db[name].games = enteroNoNegativo(db[name].games) + 1;
        });

        // La victoria cuenta únicamente para el equipo ganador.
        equiposActuales[equipo].forEach(name => {
            db[name].w = enteroNoNegativo(db[name].w) + 1;
        });

        ['blue', 'red'].forEach(lado => {
            const mvp = mvpActual[lado];
            if (mvp && db[mvp]) db[mvp].m = enteroNoNegativo(db[mvp].m) + 1;
        });

        const partida = {
            fecha: new Date().toLocaleString('es-ES'),
            blue: [...equiposActuales.blue],
            red: [...equiposActuales.red],
            blueData: equiposActuales.blue.map(name => ({
                name,
                champion: campeonesActuales.blue[name]?.name || null,
                image: campeonesActuales.blue[name]?.image || null
            })),
            redData: equiposActuales.red.map(name => ({
                name,
                champion: campeonesActuales.red[name]?.name || null,
                image: campeonesActuales.red[name]?.image || null
            })),
            ganador: equipo,
            perdedor: equipo === 'blue' ? 'red' : 'blue',
            mvpBlue: mvpActual.blue,
            mvpRed: mvpActual.red
        };

        historialPartidas.unshift(partida);
        historialPartidas = historialPartidas.slice(0, 20);

        partidaPendiente = false;
        document.getElementById('winner-panel').style.display = 'none';
        actualizarInterfaz();
        alert("Victoria registrada para el " + (equipo === 'blue' ? "EQUIPO AZUL." : "EQUIPO ROJO."));
    }


    function abrirHistorial() {
        renderHistorial();
        document.getElementById('history-modal').style.display = 'block';
    }

    function cerrarHistorial(event) {
        if (!event || event.target.id === 'history-modal' || event.currentTarget?.tagName === 'BUTTON') {
            document.getElementById('history-modal').style.display = 'none';
        }
    }

    function renderHistorial() {
        const container = document.getElementById('history-list');
        if (!container) return;

        if (historialPartidas.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#f0e6d2;">Todavía no hay partidas registradas.</p>';
            return;
        }

        container.innerHTML = historialPartidas.map((partida, index) => {
            const nombreGanador = partida.ganador === 'blue' ? 'EQUIPO AZUL' : 'EQUIPO ROJO';
            const nombrePerdedor = partida.perdedor === 'blue' ? 'EQUIPO AZUL' : 'EQUIPO ROJO';
            const blueNames = Array.isArray(partida.blue) ? partida.blue : [];
            const redNames = Array.isArray(partida.red) ? partida.red : [];
            const blueData = Array.isArray(partida.blueData) ? partida.blueData : blueNames.map(name => ({ name, champion: null, image: null }));
            const redData = Array.isArray(partida.redData) ? partida.redData : redNames.map(name => ({ name, champion: null, image: null }));

            const renderHistoryPlayers = (players) => players.map(rawPlayer => {
                const player = typeof rawPlayer === 'string'
                    ? { name: rawPlayer, champion: null, image: null }
                    : (rawPlayer && typeof rawPlayer === 'object' ? rawPlayer : { name: 'Desconocido' });
                const imageUrl = urlImagenCampeonSegura(player.image);
                const nombre = escaparHTML(player.name || 'Jugador desconocido');
                const campeon = escaparHTML(player.champion || 'Campeón no registrado');
                return `
                    <div class="history-player">
                        ${imageUrl ? `<img src="${escaparHTML(imageUrl)}" alt="${campeon}" loading="lazy">` : ''}
                        <div>
                            <strong>${nombre}</strong>
                            <small>${campeon}</small>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="history-match">
                    <h3>PARTIDA #${historialPartidas.length - index} · ${escaparHTML(partida.fecha || 'Fecha desconocida')}</h3>
                    <div class="history-team">
                        <strong style="color:var(--blue-bright)">EQUIPO AZUL</strong>
                        <div class="history-players">${renderHistoryPlayers(blueData)}</div>
                        <div style="margin-top:8px;">MVP: <strong>${escaparHTML(partida.mvpBlue || 'Sin registrar')}</strong></div>
                    </div>
                    <div class="history-team">
                        <strong style="color:var(--red)">EQUIPO ROJO</strong>
                        <div class="history-players">${renderHistoryPlayers(redData)}</div>
                        <div style="margin-top:8px;">MVP: <strong>${escaparHTML(partida.mvpRed || 'Sin registrar')}</strong></div>
                    </div>
                    <div class="history-winner">
                        GANADOR: ${nombreGanador} · PERDEDOR: ${nombrePerdedor}
                    </div>
                </div>
            `;
        }).join('');
    }

    function animarPareja(containerId, name) {
        return new Promise(resolve => {
            const container = document.getElementById(containerId);
            const slot = document.createElement('div');
            slot.className = 'slot visible';
            const equipo = containerId.replace("slots-", "");
            slot.innerHTML = `<img src="" alt="" style="filter:grayscale(1)"> <div><b>${escaparHTML(name)}</b><br><small class="champ-name">...</small></div><button class="mvp-button" data-equipo="${equipo}" data-player="${escaparHTML(name)}" disabled>MVP</button>`;
            container.appendChild(slot);
            const img = slot.querySelector('img');
            const txt = slot.querySelector('.champ-name');
            let loops = 0;
            const maxLoops = 18 + Math.floor(Math.random() * 10);

            const interval = setInterval(() => {
                const c = CHAMPIONS[Math.floor(Math.random() * CHAMPIONS.length)];
                img.src = `https://ddragon.leagueoflegends.com/cdn/${VERSION}/img/champion/${c.id}.png`;
                txt.innerText = c.name;
                playTick();

                if(loops++ > maxLoops) {
                    clearInterval(interval);

                    // Nunca repetimos campeón dentro del mismo equipo.
                    const campeonesUsados = Object.values(campeonesActuales[equipo])
                        .map(campeon => campeon?.name)
                        .filter(Boolean);

                    const campeonesDisponibles = CHAMPIONS.filter(champion =>
                        !campeonesUsados.includes(champion.name)
                    );

                    const campeonFinal =
                        campeonesDisponibles.length > 0
                            ? campeonesDisponibles[
                                Math.floor(Math.random() * campeonesDisponibles.length)
                            ]
                            : c;

                    img.src = `https://ddragon.leagueoflegends.com/cdn/${VERSION}/img/champion/${campeonFinal.id}.png`;
                    txt.innerText = campeonFinal.name;
                    img.style.filter = "none";
                    slot.classList.add('active');

                    campeonesActuales[equipo][name] = {
                        name: campeonFinal.name,
                        image: img.src
                    };

                    playBoom();
                    resolve();
                }
            }, 80);
        });
    }

    function abrirEditor() {
        if (sorteoEnCurso || partidaPendiente) return alert("No puedes editar jugadores durante una partida pendiente.");
        document.getElementById('editor-pin-panel').style.display = 'block';
        document.getElementById('editor-pin-input').value = '';
        document.getElementById('editor-pin-input').focus();
    }

    function comprobarPINEditor() {
        const pin = document.getElementById('editor-pin-input').value;
        if (pin !== PIN_SECRET) return alert("ACCESO DENEGADO");
        document.getElementById('editor-pin-panel').style.display = 'none';
        document.getElementById('editor-panel').style.display = 'block';
        renderEditor();
    }

    function renderEditor() {
        document.getElementById('tabla-editor').innerHTML = Object.keys(db).sort().map(name => `
            <tr data-player="${escaparHTML(name)}">
                <td>${escaparHTML(name)}</td>
                <td><input class="editor-input" type="number" min="0" data-field="games" aria-label="Partidas de ${escaparHTML(name)}" value="${enteroNoNegativo(db[name].games)}"></td>
                <td><input class="editor-input" type="number" min="0" data-field="w" aria-label="Victorias de ${escaparHTML(name)}" value="${enteroNoNegativo(db[name].w)}"></td>
                <td><input class="editor-input" type="number" min="0" data-field="m" aria-label="MVP de ${escaparHTML(name)}" value="${enteroNoNegativo(db[name].m)}"></td>
                <td><input class="editor-input" type="number" min="0" max="5" step="0.5" data-field="level" aria-label="Nivel de ${escaparHTML(name)}" value="${nivelSeguro(db[name].level)}"></td>
                <td>
                    <button type="button" data-action="rename" data-player="${escaparHTML(name)}" style="padding:5px; margin-right:5px;" aria-label="Renombrar ${escaparHTML(name)}">✎</button>
                    <button type="button" data-action="delete" data-player="${escaparHTML(name)}" style="background:red; padding:5px;" aria-label="Eliminar ${escaparHTML(name)}">X</button>
                </td>
            </tr>
        `).join('');
    }

    function editarNombre(nombreActual) {
        const nuevoNombre = prompt("Nuevo nombre del Invocador:", nombreActual);
        if (nuevoNombre === null) return;

        const nombreLimpio = nuevoNombre.trim();
        if (!nombreLimpio) return alert("El nombre no puede estar vacío.");
        if (nombreLimpio === nombreActual) return;

        if (db[nombreLimpio]) {
            return alert("Ya existe un jugador con ese nombre.");
        }

        db[nombreLimpio] = db[nombreActual];
        delete db[nombreActual];
        seleccionados = seleccionados.map(nombre => nombre === nombreActual ? nombreLimpio : nombre);

        actualizarInterfaz();
        renderEditor();
    }

    function reiniciarHistorial() {
        if (!confirm("¿Seguro que quieres borrar las últimas 20 partidas del historial? Esta acción no modifica las estadísticas de los jugadores.")) return;
        historialPartidas = [];
        localStorage.removeItem('lol_match_history');
        renderHistorial();
    }

    function nuevoJugador() {
        const entrada = prompt("Nombre del Invocador:");
        if (entrada === null) return;
        const nombre = entrada.trim();
        if (!nombre) return alert("El nombre no puede estar vacío.");
        if (nombre.length > 32) return alert("El nombre no puede superar los 32 caracteres.");
        if (db[nombre]) return alert("Ya existe un jugador con ese nombre.");
        db[nombre] = { w: 0, m: 0, games: 0, level: 3 };
        actualizarInterfaz();
        renderEditor();
    }

    function exportarDatos() {
        const copia = {
            format: 'league-of-colegones-backup',
            version: 1,
            exportedAt: new Date().toISOString(),
            jugadores: db,
            historialPartidas
        };
        const blob = new Blob([JSON.stringify(copia, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const enlace = document.createElement('a');
        enlace.href = url;
        enlace.download = 'league-of-colegones-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(enlace);
        enlace.click();
        enlace.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function importarDatos(event) {
        const input = event.target;
        const archivo = input.files && input.files[0];
        if (!archivo) return;
        try {
            if (archivo.size > 5 * 1024 * 1024) throw new Error('El archivo supera los 5 MB.');
            const copia = JSON.parse(await archivo.text());
            if (
                copia?.format !== 'league-of-colegones-backup' ||
                copia.version !== 1 ||
                !copia.jugadores || typeof copia.jugadores !== 'object' ||
                !Array.isArray(copia.historialPartidas)
            ) throw new Error('El formato del archivo no es válido.');

            const nuevosJugadores = {};
            Object.entries(copia.jugadores).forEach(([nombreOriginal, stats]) => {
                const nombre = String(nombreOriginal).trim();
                if (!nombre || nombre.length > 32 || !stats || typeof stats !== 'object') return;
                nuevosJugadores[nombre] = {
                    w: enteroNoNegativo(stats.w),
                    m: enteroNoNegativo(stats.m),
                    games: enteroNoNegativo(stats.games),
                    level: nivelSeguro(stats.level)
                };
            });
            if (Object.keys(nuevosJugadores).length === 0) throw new Error('La copia no contiene jugadores válidos.');

            const nuevoHistorial = copia.historialPartidas
                .filter(partida => partida && Array.isArray(partida.blue) && Array.isArray(partida.red) && ['blue', 'red'].includes(partida.ganador))
                .slice(0, 20);

            if (!confirm('Importar esta copia reemplazará el ranking y el historial actuales. ¿Continuar?')) return;
            db = nuevosJugadores;
            historialPartidas = nuevoHistorial;
            seleccionados = [];
            equiposActuales = { blue: [], red: [] };
            campeonesActuales = { blue: {}, red: {} };
            mvpElegido = { blue: false, red: false };
            mvpActual = { blue: null, red: null };
            partidaPendiente = false;
            actualizarInterfaz();
            renderEditor();
            alert('Copia importada correctamente.');
        } catch (error) {
            console.error('No se pudo importar la copia.', error);
            alert('No se pudo importar la copia: ' + error.message);
        } finally {
            input.value = '';
        }
    }

    function configurarEventosDelegados() {
        const grid = document.getElementById('grid-jugadores');
        grid.addEventListener('click', event => {
            const tarjeta = event.target.closest('[data-player]');
            if (tarjeta) togglePlayer(tarjeta.dataset.player);
        });
        grid.addEventListener('keydown', event => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            const tarjeta = event.target.closest('[data-player]');
            if (!tarjeta) return;
            event.preventDefault();
            togglePlayer(tarjeta.dataset.player);
        });

        ['blue', 'red'].forEach(equipo => {
            document.getElementById('slots-' + equipo).addEventListener('click', event => {
                const boton = event.target.closest('.mvp-button');
                if (boton) registrarMVP(boton.dataset.equipo, boton.dataset.player, boton);
            });
        });

        const tablaEditor = document.getElementById('tabla-editor');
        tablaEditor.addEventListener('change', event => {
            const entrada = event.target.closest('[data-field]');
            const fila = entrada?.closest('tr[data-player]');
            if (!entrada || !fila || !db[fila.dataset.player]) return;
            const jugador = db[fila.dataset.player];
            switch (entrada.dataset.field) {
                case 'games': jugador.games = enteroNoNegativo(entrada.value); break;
                case 'w': jugador.w = enteroNoNegativo(entrada.value); break;
                case 'm': jugador.m = enteroNoNegativo(entrada.value); break;
                case 'level': jugador.level = nivelSeguro(entrada.value); break;
                default: return;
            }
            actualizarInterfaz();
        });
        tablaEditor.addEventListener('click', event => {
            const boton = event.target.closest('button[data-action]');
            if (!boton) return;
            const nombre = boton.dataset.player;
            if (!db[nombre]) return;
            if (boton.dataset.action === 'rename') {
                editarNombre(nombre);
            } else if (boton.dataset.action === 'delete') {
                if (!confirm('¿Seguro que quieres eliminar a ' + nombre + '?')) return;
                delete db[nombre];
                seleccionados = seleccionados.filter(jugador => jugador !== nombre);
                actualizarInterfaz();
                renderEditor();
            }
        });
    }

    function cerrarEditor() {
        document.getElementById('editor-panel').style.display = 'none';
        actualizarInterfaz();
    }

    configurarEventosDelegados();
    init();
</script>
