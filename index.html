<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEAGUE OF FRIENDS - PURE EDITION</title>
    <style>
        :root { 
            --gold: #c8aa6e; --gold-dark: #785a28; --blue-dark: #010a13; 
            --blue-medium: #091428; --blue-bright: #007eff; --red: #e22222;
        }
        body { background: var(--blue-dark); color: var(--gold); font-family: 'Times New Roman', serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; border: 1px solid var(--gold-dark); background: var(--blue-medium); padding: 40px; box-shadow: 0 0 50px black; }
        h1, h2 { text-transform: uppercase; letter-spacing: 4px; border-bottom: 2px solid var(--gold-dark); padding-bottom: 10px; text-align: center; color: white; }
        .ranking-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .ranking-table th { background: var(--gold-dark); color: black; padding: 12px; text-transform: uppercase; }
        .ranking-table td { padding: 12px; text-align: center; border-bottom: 1px solid rgba(200,170,110,0.2); color: #f0e6d2; }
        .selector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 30px 0; }
        .player-card { border: 1px solid var(--gold-dark); padding: 15px; text-align: center; cursor: pointer; background: rgba(0,0,0,0.3); text-transform: uppercase; }
        .player-card.selected { background: var(--gold); color: black; box-shadow: 0 0 15px var(--gold); }
        .teams-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .team-box { border: 1px solid var(--gold-dark); min-height: 300px; padding: 20px; background: rgba(0,0,0,0.4); }
        .blue-side { border-top: 5px solid var(--blue-bright); }
        .red-side { border-top: 5px solid var(--red); }
        .slot { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; padding: 10px; background: rgba(255,255,255,0.03); opacity: 0; transition: opacity 0.5s; border: 1px solid transparent; }
        .slot.visible { opacity: 1; }
        .slot img { width: 60px; height: 60px; border: 1px solid var(--gold-dark); }
        .slot.active { border: 1px solid var(--gold); background: rgba(200,170,110,0.1); }
        .mvp-button { margin-left: auto; padding: 8px 12px; font-size: 0.75em; }
        .mvp-button.selected { background: var(--gold); color: black; }
        .mvp-button:disabled { opacity: 0.4; cursor: not-allowed; }
        #editor-panel { display: none; background: #050d17; border: 2px solid var(--gold); padding: 20px; margin-top: 20px; }
        .editor-input { background: black; color: white; border: 1px solid var(--gold-dark); padding: 5px; width: 60px; }
        button { background: var(--gold-dark); color: white; border: 1px solid var(--gold); padding: 15px 30px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        button:hover { background: var(--gold); color: black; }
        @media (max-width: 700px) {
            body { padding: 8px; }
            .container { padding: 20px; }
            .teams-wrapper { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div id="test-info" style="font-size: 0.8em; opacity: 0.5; text-align: center;">CONECTANDO CON SERVIDORES DE RIOT...</div>
    <h1>RANKING</h1>
    <table class="ranking-table">
        <thead><tr><th>Rango</th><th>Invocador</th><th>Puntos</th><th>Victorias</th><th>MVP</th><th>Win Rate</th></tr></thead>
        <tbody id="lista-ranking"></tbody>
    </table>
    <div style="text-align: right; margin-top: 15px;"><button onclick="desbloquearPartida()">DESBLOQUEAR PARTIDA</button></div>
    <div id="pin-panel" style="display: none; margin-top: 15px; padding: 20px; border: 1px solid var(--gold-dark); text-align: center; background: rgba(0,0,0,0.3);">
        <input id="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" style="background: black; color: white; border: 1px solid var(--gold-dark); padding: 12px; width: 120px; text-align: center; font-size: 1.2em;">
        <button onclick="comprobarPIN()" style="margin-left: 10px;">ENTRAR</button>
    </div>
    <div id="editor-pin-panel" style="display: none; margin-top: 15px; padding: 20px; border: 1px solid var(--gold-dark); text-align: center; background: rgba(0,0,0,0.3);">
        <input id="editor-pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" style="background: black; color: white; border: 1px solid var(--gold-dark); padding: 12px; width: 120px; text-align: center; font-size: 1.2em;">
        <button onclick="comprobarPINEditor()" style="margin-left: 10px;">ENTRAR</button>
    </div>
    <div id="zona-protegida" style="display: none;">
    <div style="text-align: right;"><button onclick="abrirEditor()">Modo Editor</button></div>
    <div id="editor-panel">
        <h2>EDITOR DE INVOCADORES</h2>
        <table class="ranking-table">
            <thead><tr><th>Nombre</th><th>W</th><th>M</th><th>Nivel</th><th>Acción</th></tr></thead>
            <tbody id="tabla-editor"></tbody>
        </table>
        <button onclick="nuevoJugador()">+ Nuevo Jugador</button>
        <button onclick="cerrarEditor()" style="background: #444;">Guardar Cambios</button>
    </div>
    <hr style="border:1px solid var(--gold-dark); margin: 40px 0;">
    <h2>DRAFT DE PARTIDA</h2>
    <div id="grid-jugadores" class="selector-grid"></div>
    <button style="width: 100%; font-size: 1.5em;" onclick="lanzarSorteoSequencial()">GENERAR EQUIPOS Y CAMPEONES</button>
    <div id="winner-panel" style="display: none; margin-top: 25px; padding: 20px; border: 2px solid var(--gold); text-align: center; background: rgba(200,170,110,0.08);">
        <h2 style="margin-top: 0;">EQUIPO GANADOR</h2>
        <div style="margin-bottom: 15px; color: #f0e6d2;">Selecciona un MVP de cada equipo y después el equipo ganador.</div>
        <button onclick="registrarVictoria('blue')" style="margin: 5px;">EQUIPO AZUL</button>
        <button onclick="registrarVictoria('red')" style="margin: 5px; background: var(--red);">EQUIPO ROJO</button>
    </div>
    <div class="teams-wrapper" style="margin-top: 30px;">
        <div class="team-box blue-side">
            <h3 style="color: var(--blue-bright)">EQUIPO AZUL</h3>
            <div id="slots-blue"></div>
        </div>
        <div class="team-box red-side">
            <h3 style="color: var(--red)">EQUIPO ROJO</h3>
            <div id="slots-red"></div>
        </div>
    </div>
    </div>
</div>
<script>
    const PIN_SECRET = String.fromCharCode(51, 54, 53, 52);
    let CHAMPIONS = [];
    let VERSION = "14.3.1";

    function playTick() {
        let a = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
        a.volume = 0.15; a.play();
    }

    function playBoom() {
        let a = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
        a.volume = 0.4; a.play();
    }

    let db = JSON.parse(localStorage.getItem('lol_pure_db_v3')) || {
        "Shiro": { w: 0, m: 0, games: 0 },
        "Maku": { w: 0, m: 0, games: 0 },
        "gordi": { w: 0, m: 0, games: 0 },
        "Lobo": { w: 0, m: 0, games: 0 },
        "Ivet": { w: 0, m: 0, games: 0 },
        "Lidia": { w: 0, m: 0, games: 0 },
        "Porreta": { w: 0, m: 0, games: 0 },
        "Iraida": { w: 0, m: 0, games: 0 },
        "AlexVivaEta": { w: 0, m: 0, games: 0 }
    };

    const PERFILES_CREADOS_POR_SISTEMA = [
        "Macu",
        "Borreta",
        "Alex Goreta",
        "Adame el Omega",
        "Kai",
        "Iraideta"
    ];

    PERFILES_CREADOS_POR_SISTEMA.forEach(name => {
        if (db[name]) delete db[name];
    });

    const NIVELES_INICIALES = {
        "Shiro": 5,
        "Maku": 5,
        "Macu": 5,
        "Ivet": 4.5,
        "Lobo": 4,
        "Iraida": 1.5,
        "Iraideta": 1.5,
        "adamelomega57": 3,
        "Adame el Omega": 3,
        "Lidia": 3,
        "AlexVivaEta": 2,
        "Alex Goreta": 2,
        "Porreta": 2,
        "Borreta": 2,
        "gordi": 1,
        "kayETA": 1,
        "Kai": 1
    };

    Object.keys(db).forEach(name => {
        if (db[name].games === undefined) db[name].games = 0;
        if (db[name].m === undefined) db[name].m = 0;
        if (db[name].w === undefined) db[name].w = 0;
        if (db[name].level === undefined) db[name].level = NIVELES_INICIALES[name] ?? 3;
    });

    const AJUSTE_50_ALEX_IRAIDA = 'ajuste_50_alexgoraeta_iraideta_v1';

    if (!localStorage.getItem(AJUSTE_50_ALEX_IRAIDA)) {
        ["AlexGoraEta", "iraidETA"].forEach(name => {
            if (db[name] && db[name].games === 0 && db[name].w === 0) {
                db[name].games = 2;
                db[name].w = 1;
            }
        });
        localStorage.setItem(AJUSTE_50_ALEX_IRAIDA, '1');
    }

    function nivelJugador(name) {
        const nivel = Number(db[name]?.level);
        return Number.isFinite(nivel) ? Math.max(0, Math.min(5, nivel)) : 3;
    }

    function crearCombinaciones(array, cantidad) {
        const resultado = [];

        function recorrer(inicio, elegidos) {
            if (elegidos.length === cantidad) {
                resultado.push([...elegidos]);
                return;
            }

            for (let i = inicio; i < array.length; i++) {
                elegidos.push(array[i]);
                recorrer(i + 1, elegidos);
                elegidos.pop();
            }
        }

        recorrer(0, []);
        return resultado;
    }

    function prepararEquiposImpares(jugadores) {
        const cantidadPequeno = Math.floor(jugadores.length / 2);
        const combinaciones = crearCombinaciones(jugadores, cantidadPequeno);
        const fuerzaTotal = jugadores.reduce((total, name) => total + nivelJugador(name), 0);

        const objetivos = combinaciones.map(pequeno => {
            const fuerzaPequeno = pequeno.reduce((total, name) => total + nivelJugador(name), 0);
            const fuerzaGrande = fuerzaTotal - fuerzaPequeno;
            return {
                pequeno,
                diferencia: fuerzaPequeno - fuerzaGrande
            };
        });

        const validas = objetivos.filter(opcion => opcion.diferencia >= 0);
        const candidatas = validas.length > 0
            ? validas
            : objetivos.sort((a, b) => b.diferencia - a.diferencia).slice(0, 1);

        const mejorDiferencia = Math.min(...candidatas.map(opcion => opcion.diferencia));
        const mejores = candidatas.filter(opcion => Math.abs(opcion.diferencia - mejorDiferencia) < 0.0001);
        const elegida = mejores[Math.floor(Math.random() * mejores.length)].pequeno;
        const grande = jugadores.filter(name => !elegida.includes(name));

        if (Math.random() < 0.5) {
            return { blue: elegida, red: grande };
        }

        return { blue: grande, red: elegida };
    }

    let seleccionados = [];
    let accesoPartida = false;
    let equiposActuales = { blue: [], red: [] };
    let partidaPendiente = false;
    let mvpElegido = { blue: false, red: false };

    async function init() {
        try {
            const vRes = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
            const vData = await vRes.json();
            VERSION = vData[0];
            const cRes = await fetch(`https://ddragon.leagueoflegends.com/cdn/${VERSION}/data/es_ES/champion.json`);
            const cData = await cRes.json();
            CHAMPIONS = Object.values(cData.data);
            document.getElementById('test-info').innerText = `ASSETS CARGADOS | VER: ${VERSION} | CHAMPIONS: ${CHAMPIONS.length}`;
            actualizarInterfaz();
        } catch (e) {
            document.getElementById('test-info').innerText = "ERROR AL CARGAR CAMPEONES";
        }
    }

    function actualizarInterfaz() {
        renderRanking();
        renderSelector();
        localStorage.setItem('lol_pure_db_v3', JSON.stringify(db));
    }

    function renderRanking() {
        const ranking = Object.keys(db).map(name => ({
            name, ...db[name], pts: (db[name].w * 10) + (db[name].m * 5),
            winRate: db[name].games > 0 ? (db[name].w / db[name].games) * 100 : 0
        })).sort((a,b) => b.pts - a.pts);
        document.getElementById('lista-ranking').innerHTML = ranking.map((j, i) => `
            <tr><td>${i+1}</td><td>${j.name}</td><td>${j.pts}</td><td>${j.w}</td><td>${j.m}</td><td>${j.winRate.toFixed(1)}%</td></tr>
        `).join('');
    }

    function renderSelector() {
        const grid = document.getElementById('grid-jugadores');
        grid.innerHTML = Object.keys(db).sort().map(name => `
            <div class="player-card ${seleccionados.includes(name) ? 'selected' : ''}" onclick="togglePlayer('${name}')">${name}</div>
        `).join('');
    }

    function desbloquearPartida() {
        if (accesoPartida) return;
        document.getElementById('pin-panel').style.display = 'block';
        document.getElementById('pin-input').value = '';
        document.getElementById('pin-input').focus();
    }

    function comprobarPIN() {
        const pin = document.getElementById('pin-input').value;
        if (pin !== PIN_SECRET) return alert("ACCESO DENEGADO");
        accesoPartida = true;
        document.getElementById('pin-panel').style.display = 'none';
        document.getElementById('zona-protegida').style.display = 'block';
    }

    function togglePlayer(name) {
        if (!accesoPartida) return alert("Introduce el PIN para acceder a la partida.");
        if (seleccionados.includes(name)) seleccionados = seleccionados.filter(n => n !== name);
        else if (seleccionados.length < 10) seleccionados.push(name);
        renderSelector();
    }

    async function lanzarSorteoSequencial() {
        if (!accesoPartida) return alert("Introduce el PIN para acceder a la partida.");
        if (partidaPendiente) return alert("Registra primero el equipo ganador de la partida actual.");
        if (seleccionados.length < 2) return alert("Selecciona al menos 2 jugadores.");
        const shuffle = [...seleccionados].sort(() => Math.random() - 0.5);
        let blueSide;
        let redSide;

        if (shuffle.length % 2 === 0) {
            const mitad = shuffle.length / 2;
            blueSide = shuffle.slice(0, mitad);
            redSide = shuffle.slice(mitad);
        } else {
            const equipos = prepararEquiposImpares(shuffle);
            blueSide = equipos.blue;
            redSide = equipos.red;
        }
        equiposActuales = { blue: [...blueSide], red: [...redSide] };
        mvpElegido = { blue: false, red: false };
        partidaPendiente = false;
        document.getElementById('winner-panel').style.display = 'none';
        document.getElementById('slots-blue').innerHTML = "";
        document.getElementById('slots-red').innerHTML = "";

        const rondas = Math.max(blueSide.length, redSide.length);
        for(let i = 0; i < rondas; i++) {
            const animaciones = [];
            if (blueSide[i]) animaciones.push(animarPareja('slots-blue', blueSide[i]));
            if (redSide[i]) animaciones.push(animarPareja('slots-red', redSide[i]));
            await Promise.all(animaciones);
            if(i < rondas - 1) await new Promise(r => setTimeout(r, 1500));
        }

        seleccionados.forEach(name => {
            db[name].games++;
        });
        partidaPendiente = true;
        document.getElementById('winner-panel').style.display = 'block';
        actualizarInterfaz();
    }

    function registrarMVP(equipo, name, button) {
        if (!partidaPendiente || mvpElegido[equipo]) return;
        if (!equiposActuales[equipo].includes(name)) return;

        db[name].m++;
        mvpElegido[equipo] = true;
        button.classList.add('selected');
        button.innerText = 'MVP ✓';

        document.querySelectorAll('#slots-' + equipo + ' .mvp-button').forEach(btn => {
            if (btn !== button) btn.disabled = true;
        });

        actualizarInterfaz();
    }

    function registrarVictoria(equipo) {
        if (!partidaPendiente) return;
        if (!mvpElegido.blue || !mvpElegido.red) {
            return alert("Selecciona un MVP para cada equipo antes de registrar el ganador.");
        }
        equiposActuales[equipo].forEach(name => {
            db[name].w++;
        });
        partidaPendiente = false;
        document.getElementById('winner-panel').style.display = 'none';
        actualizarInterfaz();
        alert("Victoria registrada para el " + (equipo === 'blue' ? "EQUIPO AZUL." : "EQUIPO ROJO."));
    }

    function animarPareja(containerId, name) {
        return new Promise(resolve => {
            const container = document.getElementById(containerId);
            const slot = document.createElement('div');
            slot.className = 'slot visible';
            const equipo = containerId.replace("slots-", "");
            slot.innerHTML = `<img src="" style="filter:grayscale(1)"> <div><b>${name}</b><br><small class="champ-name">...</small></div><button class="mvp-button" onclick="registrarMVP('${equipo}', '${name}', this)">MVP</button>`;
            container.appendChild(slot);
            const img = slot.querySelector('img');
            const txt = slot.querySelector('.champ-name');
            let loops = 0;
            const maxLoops = 18 + Math.floor(Math.random() * 10);

            const interval = setInterval(() => {
                const c = CHAMPIONS[Math.floor(Math.random() * CHAMPIONS.length)];
                img.src = `https://ddragon.leagueoflegends.com/cdn/${VERSION}/img/champion/${c.id}.png`;
                txt.innerText = c.name;
                playTick();

                if(loops++ > maxLoops) {
                    clearInterval(interval);
                    img.style.filter = "none";
                    slot.classList.add('active');
                    playBoom();
                    resolve();
                }
            }, 80);
        });
    }

    function abrirEditor() {
        document.getElementById('editor-pin-panel').style.display = 'block';
        document.getElementById('editor-pin-input').value = '';
        document.getElementById('editor-pin-input').focus();
    }

    function comprobarPINEditor() {
        const pin = document.getElementById('editor-pin-input').value;
        if (pin !== PIN_SECRET) return alert("ACCESO DENEGADO");
        document.getElementById('editor-pin-panel').style.display = 'none';
        document.getElementById('editor-panel').style.display = 'block';
        renderEditor();
    }

    function renderEditor() {
        document.getElementById('tabla-editor').innerHTML = Object.keys(db).map(name => `
            <tr>
                <td>${name}</td>
                <td><input class="editor-input" type="number" value="${db[name].w}" onchange="db['${name}'].w=Math.max(0, parseInt(this.value) || 0)"></td>
                <td><input class="editor-input" type="number" value="${db[name].m}" onchange="db['${name}'].m=Math.max(0, parseInt(this.value) || 0)"></td>
                <td><input class="editor-input" type="number" min="0" max="5" step="0.5" value="${db[name].level}" onchange="db['${name}'].level=Math.max(0, Math.min(5, parseFloat(this.value) || 0))"></td>
                <td>
                    <button onclick="editarNombre(this.closest('tr').querySelector('td').innerText)" style="padding:5px; margin-right:5px;">✎</button>
                    <button onclick="if(confirm('¿Eliminar?')){delete db['${name}']; renderEditor();}" style="background:red; padding:5px;">X</button>
                </td>
            </tr>
        `).join('');
    }

    function editarNombre(nombreActual) {
        const nuevoNombre = prompt("Nuevo nombre del Invocador:", nombreActual);
        if (nuevoNombre === null) return;

        const nombreLimpio = nuevoNombre.trim();
        if (!nombreLimpio) return alert("El nombre no puede estar vacío.");
        if (nombreLimpio === nombreActual) return;

        if (db[nombreLimpio]) {
            return alert("Ya existe un jugador con ese nombre.");
        }

        db[nombreLimpio] = db[nombreActual];
        delete db[nombreActual];

        actualizarInterfaz();
        renderEditor();
    }

    function nuevoJugador() {
        const n = prompt("Nombre del Invocador:");
        if(n) { db[n] = { w: 0, m: 0, games: 0, level: 3 }; renderEditor(); }
    }

    function cerrarEditor() {
        document.getElementById('editor-panel').style.display = 'none';
        actualizarInterfaz();
    }

    init();
</script>
</body>
</html>
